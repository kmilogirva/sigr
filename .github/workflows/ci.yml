name: CI

# Se ejecuta en cada Pull Request hacia develop o main y en cada push a develop.
# También se puede lanzar a mano (workflow_dispatch) para incluir seguridad y rendimiento.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 1. Compilación y pruebas unitarias (rápidas, sin base de datos) ----------
  unitarias:
    name: Compilar y pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Compilar
        run: dotnet build SIGR.sln -c Release

      - name: Pruebas unitarias con cobertura
        run: >
          dotnet test tests/SIGR.Tests/SIGR.Tests.csproj -c Release --no-build
          --collect:"XPlat Code Coverage" --logger "trx;LogFileName=unitarias.trx"
          --results-directory resultados-unitarias

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-unitarias
          path: resultados-unitarias

  # ---------- 2. Pruebas de interfaz y API contra el sistema completo en contenedores Linux ----------
  e2e:
    name: Selenium, Playwright y Newman (contenedores)
    runs-on: ubuntu-latest
    needs: unitarias
    steps:
      - uses: actions/checkout@v4

      - name: Levantar sistema y base de datos
        run: |
          mkdir -p tests/evidencia
          docker compose up -d --build web
          for i in $(seq 1 60); do
            curl -fs http://localhost:8080/health && break
            sleep 3
          done
          curl -fs http://localhost:8080/health

      - name: Playwright (E2E)
        run: docker compose --profile tests run --rm --build playwright-tests

      - name: Selenium (interfaz)
        if: always()
        run: docker compose --profile tests run --rm --build selenium-tests

      - name: Newman (API)
        if: always()
        run: docker compose --profile tests run --rm newman

      - name: Guardar evidencia (capturas, reportes y trazas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-e2e
          path: tests/evidencia

      - name: Registros de la aplicación
        if: failure()
        run: docker compose logs web

      - name: Apagar
        if: always()
        run: docker compose down -v

  # ---------- 3. Seguridad y rendimiento (solo bajo demanda: tardan más) ----------
  seguridad-y-rendimiento:
    name: OWASP ZAP y k6 (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Levantar sistema
        run: |
          mkdir -p tests/evidencia/zap tests/evidencia/k6
          docker compose up -d --build web
          for i in $(seq 1 60); do curl -fs http://localhost:8080/health && break; sleep 3; done

      - name: OWASP ZAP (escaneo base)
        run: docker compose --profile security run --rm zap

      - name: k6 (carga)
        if: always()
        run: docker compose --profile performance run --rm k6

      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-seguridad-rendimiento
          path: tests/evidencia

      - name: Apagar
        if: always()
        run: docker compose down -v
